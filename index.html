<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>TradeMind AI v0.3</title><style>body{margin:0;font-family:Arial;background:#0b1020;color:#eee}header{padding:20px;font-size:24px;font-weight:700;border-bottom:1px solid #26304a}.wrap{max-width:900px;margin:auto;padding:20px}.tabs button,.btn{padding:12px 16px;margin:5px;border:1px solid #39445f;border-radius:10px;background:#141c31;color:#fff}.btn{background:#3157d5;border:0}section{background:#121a2d;padding:20px;border-radius:16px;margin-top:15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-size:13px;color:#aeb8d0}input,select{width:100%;box-sizing:border-box;padding:12px;margin-top:6px;background:#0b1020;color:#fff;border:1px solid #39445f;border-radius:9px}h2{margin-top:0}.card{padding:15px;border:1px solid #303b57;border-radius:12px;margin:10px 0}.danger{background:#9b2c3d}.muted{color:#9ba7c0}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><header>TradeMind AI <span class="muted">v0.3</span></header><div class="wrap"><div class="tabs"><button onclick="show('dashboard')">Dashboard</button><button onclick="show('strategy')">Strategy Lab</button><button onclick="show('portfolio')">Paper Portfolio</button></div><div id="app"></div></div><script>
const KEY='tm_strategies_v03'; let strategies=JSON.parse(localStorage.getItem(KEY)||'[]');
function save(){localStorage.setItem(KEY,JSON.stringify(strategies))}
function show(p){if(p==='strategy') strategy(); else if(p==='portfolio') portfolio(); else dashboard()}
function dashboard(){app.innerHTML='<section><h2>Dashboard</h2><p>Private Trading Lab</p><p class="muted">Paper trading and strategy development.</p></section><section><h2>Build next</h2><p>Strategy Lab is now functional. Create and save a strategy before backtesting.</p></section>'}
function strategy(){app.innerHTML=`<section><h2>Strategy Builder</h2><p class="muted">Create rules you can later backtest and connect to paper trading.</p><div class="grid"><label>Strategy name<input id="name" placeholder="e.g. BTC Trend Strategy"></label><label>Market<select id="market"><option>BTC/USD</option><option>ETH/USD</option><option>S&P 500</option><option>Custom</option></select></label><label>Timeframe<select id="tf"><option>5m</option><option>15m</option><option>1H</option><option>4H</option><option>1D</option></select></label><label>Direction<select id="dir"><option>Long</option><option>Short</option><option>Both</option></select></label><label>Entry indicator<select id="ind"><option>RSI</option><option>Moving Average</option><option>Price vs MA</option><option>Trend</option><option>Support / Resistance</option></select></label><label>Entry rule<input id="entry" placeholder="e.g. RSI below 30"></label><label>Exit rule<input id="exit" placeholder="e.g. RSI above 60"></label><label>Stop loss %<input id="sl" type="number" step="0.1" placeholder="2"></label><label>Take profit %<input id="tp" type="number" step="0.1" placeholder="4"></label><label>Risk per trade %<input id="risk" type="number" step="0.1" placeholder="1"></label><label>Max trades/day<input id="max" type="number" value="3"></label></div><br><button class="btn" onclick="createStrategy()">Save Strategy</button></section><section><h2>My Strategies</h2><div id="list"></div></section>`; renderList()}
function createStrategy(){let vals=['name','market','tf','dir','ind','entry','exit','sl','tp','risk','max']; if(vals.some(x=>!document.getElementById(x).value)){alert('Please complete all strategy fields');return} let s={id:Date.now(),name:name.value,market:market.value,timeframe:tf.value,direction:dir.value,indicator:ind.value,entry:entry.value,exit:exit.value,stopLoss:+sl.value,takeProfit:+tp.value,risk:+risk.value,maxTrades:+max.value}; strategies.push(s);save();renderList(); alert('Strategy saved successfully')}
function renderList(){let el=document.getElementById('list'); if(!el)return; el.innerHTML=strategies.length?strategies.map(s=>`<div class="card"><b>${esc(s.name)}</b><div class="muted">${s.market} · ${s.timeframe} · ${s.direction}</div><p>Entry: ${esc(s.entry)}<br>Exit: ${esc(s.exit)}<br>SL ${s.stopLoss}% · TP ${s.takeProfit}% · Risk ${s.risk}%</p><button class="btn" onclick="useStrategy(${s.id})">Use Strategy</button><button class="btn danger" onclick="deleteStrategy(${s.id})">Delete</button></div>`).join(''):'<p class="muted">No saved strategies yet.</p>'}
function useStrategy(id){let s=strategies.find(x=>x.id===id);localStorage.setItem('tm_active_strategy',JSON.stringify(s));alert('Strategy selected for the next paper-trade/backtest workflow.')} function deleteStrategy(id){strategies=strategies.filter(x=>x.id!==id);save();renderList()} function esc(x){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function portfolio(){app.innerHTML='<section><h2>Paper Portfolio</h2><p>$10,000 simulated account</p><button class="btn" onclick="show(\'strategy\')">Build Strategy</button></section>'}show('dashboard');
</script></body></html>
